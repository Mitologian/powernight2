<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Power Night 2"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Power Night 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#fff;--fg:#111;--mute:#555;--line:#e3e3e3;--soft:#f4f4f4;--red:#c8102e;--redd:#9d0c24;--ok:#0d5a2d;
--disp:'Space Grotesk','Arial Narrow',sans-serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--red);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;opacity:.95}
h1{font-family:var(--disp);font-size:30px;line-height:1.1;margin:3px 0 0;font-weight:700}
.sub{font-size:14px;margin-top:3px;opacity:.95}
main{max-width:560px;margin:0 auto;padding:0 20px 20px}
#view>*{animation:pop .2s ease both}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){#view>*{animation:none}}
h2{font-family:var(--disp);font-size:22px;margin:22px 0 4px;font-weight:700}
.mute{color:var(--mute);font-size:14px;margin:4px 0}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 -20px;padding:0 20px;position:sticky;top:0;background:#fff;z-index:5}
.tabs button{flex:1;border:0;background:none;padding:15px 4px 12px;font:inherit;font-size:15px;font-weight:500;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:8}
nav button{border:0;background:none;padding:4px 2px;min-height:48px;font:inherit;font-size:11.5px;color:var(--mute);cursor:pointer;font-weight:600;display:grid;justify-items:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--red)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ev{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.t{font-family:var(--disp);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.ev b{display:block;font-weight:600;font-size:16px}.ev small{display:block;color:var(--mute);font-size:13.5px;margin-top:2px}
input[type=search],select,input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;padding:13px 12px;border:1px solid #cfcfcf;border-radius:6px;background:#fff;color:var(--fg)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:24px;padding-bottom:6px;border-bottom:2px solid var(--fg)}
.gh h3{font-family:var(--disp);font-size:20px;margin:0;font-weight:700}
.gd{font-size:13px;color:var(--mute);margin:6px 0 0}
.mem{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.mem b{font-weight:600}.mem small{color:var(--mute);text-align:right;font-size:13.5px}
label.l{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:16px 0 6px}
.sing{margin:16px 0 4px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat{margin-top:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.cat .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cat .h b{font-size:16px;font-weight:600}
.cat .h span{font-family:var(--disp);font-size:28px;font-weight:700;color:var(--red);min-width:30px;text-align:right}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chips button{height:48px;border:0;border-radius:4px;background:var(--soft);font:inherit;font-size:17px;font-weight:600;color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--red);color:#fff}
.go{width:100%;margin-top:22px;border:0;border-radius:6px;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:15px;min-height:50px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.msg{padding:12px;border-radius:6px;font-size:15px;margin-top:14px}.err{background:#fde8ec;color:#8a1020}.okm{background:#e3f4ea;color:#0d5a2d}
.empty{text-align:center;color:var(--mute);padding:36px 8px}
.ref{border:1px solid #cfcfcf;background:#fff;border-radius:6px;padding:10px 16px;font:inherit;cursor:pointer;margin-top:16px}
.lead{margin-top:18px;background:var(--red);color:#fff;border-radius:8px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.lead small{display:block;font-size:11px;letter-spacing:.12em;font-weight:700}
.lead b{font-family:var(--disp);font-size:24px;line-height:1.15;display:block;margin-top:2px}
.lead .big{font-family:var(--disp);font-size:40px;font-weight:700}
.rank{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.no{font-family:var(--disp);font-size:20px;font-weight:700}
.rank b{font-weight:600;display:block}.rank small{display:block;color:var(--mute);font-size:13px}
.tot{font-family:var(--disp);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tbl{display:grid;grid-template-columns:34px 1fr 64px;gap:8px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl.h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;padding:16px 0 8px;border-bottom:2px solid var(--fg)}
.tbl .n{font-family:var(--disp);font-size:20px;font-weight:700}
.tbl b{font-weight:600}.tbl .tt{font-family:var(--disp);font-size:22px;font-weight:700;text-align:right}
.tbl .r{text-align:right}
.vs{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.vs .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.vs .row b{font-weight:600}.vs .row i{font-style:normal;font-size:12px;color:var(--mute);font-weight:700}
.win{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--ok);border-radius:4px;padding:2px 8px;margin-left:6px}
.use{border:1px solid var(--red);color:var(--red);background:#fff;border-radius:6px;padding:8px 12px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:4px;background:var(--soft);color:var(--mute);margin:3px 4px 0 0}
.grow{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.del{border:1px solid #cfcfcf;background:#fff;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;color:var(--red);cursor:pointer}
.logrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radios button{padding:13px 6px;min-height:48px;border:1px solid #cfcfcf;border-radius:6px;background:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--fg)}
.radios button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.dl{display:grid;gap:0}
</style></head>
<body>
<header><div class="eyebrow">BNI GROW</div><h1 id="ttl">Power Night 2</h1><div class="sub" id="sub">27-28 November 2026 · Driam Riverside</div></header>
<main id="view"><div class="card empty">Memuat...</div></main>
<nav role="tablist">
<button role="tab" data-t="rundown" aria-selected="true"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><span>Rundown</span></button>
<button role="tab" data-t="kelompok" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.7 0 4.5 1.8 4.5 4.5"/></svg></span><span>Kelompok</span></button>
<button role="tab" data-t="karaoke" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></span><span>Karaoke</span></button>
<button role="tab" data-t="top" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8M10 17h4"/></svg></span><span>Grow Idol</span></button>
</nav>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const API=window.PN_API||'';
let D=null,tab='rundown',kSeg='anggota',iSeg='game',sel={suara:0,gaya:0,interaksi:0},chosen='',q='',pin='';
try{pin=sessionStorage.getItem('pn_pin')||''}catch(e){}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let dev=store('pn_dev');
if(!dev){dev=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));store('pn_dev',dev)}
function voted(){try{return JSON.parse(store('pn_voted')||'[]')}catch(e){return[]}}
function addVoted(n){const v=voted();if(!v.includes(n)){v.push(n);store('pn_voted',JSON.stringify(v))}}
async function call(action,body){
 if(!API)throw new Error('Alamat API belum diisi di config.js');
 let r;
 if(body){r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},body))})}
 else{r=await fetch(API+'?action='+action)}
 const j=await r.json();
 if(!j.ok)throw new Error(j.error||'Terjadi kesalahan');
 return j.data;
}
const errMsg=e=>String((e&&e.message)||e).replace(/^Error:\s*/,'');
function msg(parent,t,ok){let m=parent.querySelector('.msg');if(!m){m=el('div','msg');parent.appendChild(m)}m.className='msg '+(ok?'okm':'err');m.textContent=t}
function seg(items,cur,on){const s=el('div','seg');items.forEach(([k,t])=>{const b=el('button','',t);b.type='button';b.setAttribute('aria-pressed',k===cur);b.onclick=()=>on(k);s.appendChild(b)});return s}

const fm=x=>Number(x).toFixed(2).replace('.',',');
let rDay='';
function render(){
 const v=$('#view');v.textContent='';
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
 $('#ttl').textContent={rundown:'Power Night 2',kelompok:'Kelompok',karaoke:'Karaoke',top:'Grow Idol'}[tab];
 $('#sub').textContent={rundown:'27-28 November 2026 · Driam Riverside',kelompok:'Tim dan skor outing',karaoke:'Nilai penampil, anonim',top:'Peringkat penyanyi'}[tab];
 if(!D){v.appendChild(el('div','empty','Memuat...'));return}
 ({rundown:rRundown,kelompok:rKelompok,karaoke:rKaraoke,top:rTop})[tab](v);
}
function rRundown(v){
 if(!D.rundown.length){v.appendChild(el('div','empty','Rundown belum diisi panitia.'));return}
 const days=[];D.rundown.forEach(r=>{if(!days.includes(r.day))days.push(r.day)});
 if(!days.includes(rDay))rDay=days[0];
 const t=el('div','tabs');days.forEach(d=>{const b=el('button','',d||'Rundown');b.type='button';b.setAttribute('aria-pressed',d===rDay);b.onclick=()=>{rDay=d;render()};t.appendChild(b)});v.appendChild(t);
 D.rundown.filter(r=>r.day===rDay).forEach(r=>{
  const e=el('div','ev');e.appendChild(el('div','t',r.time));
  const b=el('div');b.appendChild(el('b','',r.title));
  if(r.note)b.appendChild(el('small','',r.note));
  if(r.place)b.appendChild(el('small','',r.place));
  e.appendChild(b);v.appendChild(e);
 });
}
function rKelompok(v){
 const t=el('div','tabs');[['anggota','Tim saya'],['klasemen','Skor'],['input','Input']].forEach(([k,n])=>{const b=el('button','',n);b.type='button';b.setAttribute('aria-pressed',k===kSeg);b.onclick=()=>{kSeg=k;render()};t.appendChild(b)});v.appendChild(t);
 const body=el('div');v.appendChild(body);
 if(kSeg==='anggota')kAnggota(body);else if(kSeg==='klasemen')kKlasemen(body);else kInput(body);
}
function kAnggota(v){
 const s=el('input');s.type='search';s.placeholder='Cari nama kamu';s.value=q;s.style.marginTop='16px';s.setAttribute('aria-label','Cari nama');
 v.appendChild(s);
 const list=el('div');v.appendChild(list);
 s.oninput=()=>{q=s.value;renderKel(list)};renderKel(list);
}
function renderKel(list){
 list.textContent='';
 const needle=q.trim().toLowerCase();
 const rows=D.kelompok.filter(r=>!needle||(r.name+' '+r.group+' '+r.sphere).toLowerCase().includes(needle));
 if(!rows.length){list.appendChild(el('div','empty',D.kelompok.length?'Tidak ada yang cocok.':'Data tim belum diisi panitia.'));return}
 const groups={};rows.forEach(r=>{(groups[r.group||'Lainnya']=groups[r.group||'Lainnya']||[]).push(r)});
 Object.keys(groups).forEach(g=>{
  const h=el('div','gh');h.appendChild(el('h3','',g));h.appendChild(el('span','mute',groups[g].length+' orang'));list.appendChild(h);
  const note=(groups[g].find(r=>r.note)||{}).note;if(note)list.appendChild(el('p','gd',note));
  groups[g].forEach(r=>{const m=el('div','mem');m.appendChild(el('b','',r.name));if(r.sphere)m.appendChild(el('small','',r.sphere));list.appendChild(m)});
 });
}
function pairs(k,taken){
 const free=k.groups.slice().sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name)).map(g=>g.name).filter(n=>!taken.includes(n));
 const out=[];for(let i=0;i+1<free.length;i+=2)out.push([free[i],free[i+1]]);
 return {pairs:out,left:free.length%2?free[free.length-1]:''};
}
function kKlasemen(v){
 const box=el('div');v.appendChild(box);box.appendChild(el('p','mute','Memuat...'));
 call('klasemen').then(k=>{
  box.textContent='';
  box.appendChild(el('h2','','Skor game pagi'));
  box.appendChild(el('p','mute','Peringkat menentukan lawan di paintball.'));
  if(!k.groups.length){box.appendChild(el('div','empty','Belum ada tim.'));return}
  const h=el('div','tbl h');['#','Tim','Poin'].forEach((t,i)=>h.appendChild(el('span',i===2?'r':'',t)));box.appendChild(h);
  const ord=k.groups.slice().sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));
  ord.forEach((g,i)=>{const r=el('div','tbl');r.appendChild(el('span','n',String(i+1)));r.appendChild(el('b','',g.name));r.appendChild(el('span','tt',String(g.total)));box.appendChild(r)});
  box.appendChild(el('h2','','Paintball'));
  const taken=[];
  k.matches.forEach(x=>{taken.push(x.a,x.b);
   const r=el('div','vs');const row=el('div','row');row.appendChild(el('b','',x.a+' vs '+x.b));row.appendChild(el('i','',x.winner&&x.result!=='Seri'?'SELESAI':'BELUM ADA HASIL'));r.appendChild(row);
   if(x.winner&&x.result!=='Seri'){const w=el('div');w.appendChild(el('span','mute','Pemenang: '));w.appendChild(el('b','',x.winner));r.appendChild(w)}
   box.appendChild(r)});
  const p=pairs(k,taken);
  if(p.pairs.length&&ord.some(g=>g.total>0)){
   box.appendChild(el('p','mute','Usulan lawan berdasarkan peringkat (belum resmi):'));
   p.pairs.forEach(([a,b])=>{const r=el('div','vs');const row=el('div','row');row.appendChild(el('b','',a+' vs '+b));row.appendChild(el('i','','USULAN'));r.appendChild(row);box.appendChild(r)});
   if(p.left)box.appendChild(el('p','mute',p.left+' belum dapat lawan.'));
  }else if(!k.matches.length){box.appendChild(el('div','empty','Lawan paintball ditentukan setelah game pagi selesai.'))}
  box.appendChild(el('h2','','Poin per game'));
  if(!k.games.length)box.appendChild(el('p','mute','Belum ada game yang dinilai.'));
  k.games.forEach(gm=>{const w=el('div','vs');w.appendChild(el('b','',gm.name));const p2=el('div');gm.scores.forEach(s=>p2.appendChild(el('span','pill',s.group+': '+s.points)));w.appendChild(p2);box.appendChild(w)});
 }).catch(e=>{box.textContent='';box.appendChild(el('div','msg err','Gagal memuat: '+errMsg(e)))});
}
function kInput(v){
 const c=el('div');v.appendChild(c);c.appendChild(el('h2','','Input skor (panitia)'));
 if(!pin){
  c.appendChild(el('p','mute','Masukkan PIN panitia untuk mencatat skor.'));
  const i=el('input');i.type='password';i.placeholder='PIN panitia';i.inputMode='numeric';i.setAttribute('aria-label','PIN panitia');c.appendChild(i);
  const b=el('button','go','Buka');b.type='button';c.appendChild(b);
  b.onclick=()=>{b.disabled=true;call('log',{pin:i.value}).then(()=>{pin=i.value;try{sessionStorage.setItem('pn_pin',pin)}catch(e){}render()}).catch(e=>{b.disabled=false;msg(c,errMsg(e),false)})};
  return;
 }
 const sw=el('div','radios');sw.style.gridTemplateColumns='repeat(3,1fr)';
 [['game','Game'],['pb','Paintball'],['log','Riwayat']].forEach(([k,t])=>{const b=el('button','',t);b.type='button';b.setAttribute('aria-pressed',k===iSeg);b.onclick=()=>{iSeg=k;render()};sw.appendChild(b)});c.appendChild(sw);
 const body=el('div');body.style.marginTop='8px';c.appendChild(body);
 if(iSeg==='game')iGame(body);else if(iSeg==='pb')iPb(body);else iLog(body);
 const out=el('button','del','Kunci input');out.type='button';out.style.marginTop='22px';out.onclick=()=>{pin='';try{sessionStorage.removeItem('pn_pin')}catch(e){}render()};c.appendChild(out);
}
function iGame(b){
 const lab=el('label','l','Nama game');lab.htmlFor='gname';b.appendChild(lab);
 const n=el('input');n.type='text';n.id='gname';n.placeholder='mis. Estafet Balon';n.setAttribute('list','glist');b.appendChild(n);
 const dl=el('datalist');dl.id='glist';b.appendChild(dl);
 const rows=el('div');rows.style.marginTop='10px';b.appendChild(rows);
 const inputs={};
 let known={};
 D.groups.forEach(g=>{const r=el('div','grow');r.appendChild(el('b','',g));const i=el('input');i.type='number';i.inputMode='decimal';i.placeholder='poin';i.setAttribute('aria-label','Poin '+g);r.appendChild(i);inputs[g]=i;rows.appendChild(r)});
 if(!D.groups.length)rows.appendChild(el('div','empty','Isi tim di tab Kelompok pada sheet dulu.'));
 call('klasemen').then(k=>{k.games.forEach(gm=>{known[gm.name.toLowerCase()]=gm;const o=el('option');o.value=gm.name;dl.appendChild(o)})}).catch(()=>{});
 n.oninput=()=>{const gm=known[n.value.trim().toLowerCase()];Object.keys(inputs).forEach(g=>{const s=gm&&gm.scores.find(x=>x.group===g);inputs[g].value=s?s.points:''})};
 const btn=el('button','go','Simpan poin game');btn.type='button';b.appendChild(btn);
 btn.onclick=()=>{
  const scores=Object.keys(inputs).map(g=>({group:g,points:inputs[g].value})).filter(s=>s.points!=='');
  btn.disabled=true;
  call('skorGame',{pin,game:n.value,scores}).then(r=>{msg(b,'Tersimpan: '+r.saved+' tim untuk game "'+n.value.trim()+'".',true);btn.disabled=false}).catch(e=>{msg(b,errMsg(e),false);btn.disabled=false});
 };
}
function iPb(b){
 let R='';
 const mk=(id,t)=>{const l=el('label','l',t);l.htmlFor=id;b.appendChild(l);const s=el('select');s.id=id;const o=el('option','','Pilih tim');o.value='';s.appendChild(o);D.groups.forEach(g=>{const x=el('option','',g);x.value=g;s.appendChild(x)});b.appendChild(s);return s};
 const sug=el('div');b.appendChild(sug);
 const sa=mk('pa','Tim A'),sb=mk('pb2','Tim B');
 b.appendChild(el('label','l','Pemenang'));
 const rad=el('div','radios');b.appendChild(rad);
 function drawR(){rad.textContent='';[['A',(sa.value||'Tim A')+' menang'],['B',(sb.value||'Tim B')+' menang']].forEach(([k,t])=>{const x=el('button','',t);x.type='button';x.setAttribute('aria-pressed',R===k);x.onclick=()=>{R=k;drawR()};rad.appendChild(x)})}
 drawR();sa.onchange=drawR;sb.onchange=drawR;
 call('klasemen').then(k=>{
  const taken=[];k.matches.forEach(x=>taken.push(x.a,x.b));
  const p=pairs(k,taken);if(!p.pairs.length)return;
  sug.appendChild(el('label','l','Usulan lawan (dari peringkat)'));
  p.pairs.forEach(([a,c2])=>{const r=el('div','logrow');r.appendChild(el('span','',a+' vs '+c2));const u=el('button','use','Pakai');u.type='button';u.onclick=()=>{sa.value=a;sb.value=c2;R='';drawR()};r.appendChild(u);sug.appendChild(r)});
 }).catch(()=>{});
 const btn=el('button','go','Simpan pertandingan');btn.type='button';b.appendChild(btn);
 btn.onclick=()=>{btn.disabled=true;call('paintball',{pin,a:sa.value,b:sb.value,result:R}).then(()=>{msg(b,'Pertandingan tersimpan.',true);sa.value='';sb.value='';R='';drawR();btn.disabled=false}).catch(e=>{msg(b,errMsg(e),false);btn.disabled=false})};
}
function iLog(b){
 b.appendChild(el('p','mute','Memuat riwayat...'));
 call('log',{pin}).then(l=>{
  b.textContent='';
  const del=(kind,id,row)=>{const x=el('button','del','Hapus');x.type='button';x.onclick=()=>{x.disabled=true;call('hapus',{pin,kind,id}).then(()=>row.remove()).catch(e=>{x.disabled=false;msg(b,errMsg(e),false)})};return x};
  b.appendChild(el('h2','','Pertandingan paintball'));
  if(!l.matches.length)b.appendChild(el('div','mute','Belum ada.'));
  l.matches.forEach(m=>{const r=el('div','logrow');r.appendChild(el('span','',m.a+' vs '+m.b+' · '+(m.result==='Seri'?'Seri':m.winner+' menang')));r.appendChild(del('pb',m.id,r));b.appendChild(r)});
  b.appendChild(el('h2','','Poin game (40 terbaru)'));
  if(!l.games.length)b.appendChild(el('div','mute','Belum ada.'));
  l.games.forEach(m=>{const r=el('div','logrow');r.appendChild(el('span','',m.game+' · '+m.group+' · '+m.points));r.appendChild(del('game',m.id,r));b.appendChild(r)});
 }).catch(e=>{b.textContent='';msg(b,errMsg(e),false)});
}
function rKaraoke(v){
 const c=el('div');v.appendChild(c);
 c.appendChild(el('p','mute','Anonim. Satu penyanyi hanya bisa dinilai satu kali dari perangkat ini. Skor 1 sampai 10.'));
 if(!D.open){c.appendChild(el('div','msg err','Penilaian sedang ditutup panitia.'));return}
 const done=voted();
 const lab=el('label','l','Penyanyi yang sedang tampil');lab.htmlFor='sg';c.appendChild(lab);
 const s=el('select');s.id='sg';
 const o0=el('option','','Pilih nama penyanyi');o0.value='';s.appendChild(o0);
 D.singers.forEach(x=>{const o=el('option','',(done.includes(x.name)?'✓ ':'')+x.name+(x.song?' · '+x.song:''));o.value=x.name;s.appendChild(o)});
 s.value=chosen;c.appendChild(s);
 const box=el('div');c.appendChild(box);
 const btn=el('button','go','Kirim penilaian');btn.type='button';btn.disabled=true;
 [['suara','Suara'],['gaya','Gaya'],['interaksi','Interaksi penonton']].forEach(([k,t])=>{
  const w=el('div','cat');const h=el('div','h');h.appendChild(el('b','',t));const val=el('span','',sel[k]||'-');h.appendChild(val);w.appendChild(h);
  const ch=el('div','chips');
  for(let i=1;i<=10;i++){const b=el('button','',String(i));b.type='button';b.setAttribute('aria-pressed',sel[k]===i);
   b.onclick=()=>{sel[k]=i;val.textContent=i;ch.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));check()};ch.appendChild(b)}
  w.appendChild(ch);box.appendChild(w);
 });
 function check(){btn.disabled=!(chosen&&sel.suara&&sel.gaya&&sel.interaksi&&!voted().includes(chosen))}
 s.onchange=()=>{chosen=s.value;const m=c.querySelector('.msg');if(m)m.remove();if(voted().includes(chosen))msg(c,'Kamu sudah menilai '+chosen+'.',false);check()};
 btn.onclick=()=>{
  btn.disabled=true;btn.textContent='Mengirim...';
  call('rate',{singer:chosen,suara:sel.suara,gaya:sel.gaya,interaksi:sel.interaksi,device:dev}).then(()=>{
   addVoted(chosen);const n=chosen;chosen='';sel={suara:0,gaya:0,interaksi:0};rKaraokeDone(n);
  }).catch(e=>{const m=errMsg(e);if(/sudah menilai/.test(m))addVoted(chosen);msg(c,m,false);btn.textContent='Kirim penilaian';check()});
 };
 c.appendChild(btn);check();
}
function rKaraokeDone(n){
 const v=$('#view');v.textContent='';
 v.appendChild(el('h2','','Terkirim'));
 v.appendChild(el('div','msg okm','Penilaian untuk '+n+' sudah tercatat. Terima kasih!'));
 const b=el('button','go','Nilai penyanyi berikutnya');b.type='button';b.onclick=render;v.appendChild(b);
}
function rTop(v){
 const c=el('div');v.appendChild(c);
 c.appendChild(el('p','mute','Memuat peringkat...'));
 call('top').then(r=>{
  c.textContent='';
  if(r.hidden){c.appendChild(el('div','empty','Peringkat Grow Idol akan diumumkan panitia di akhir acara.'));return}
  if(!r.list.length){c.appendChild(el('div','empty','Belum ada penilaian masuk.'));return}
  const f=r.list[0];
  const lead=el('div','lead');const lt=el('div');lt.appendChild(el('small','','PERINGKAT 1'));lt.appendChild(el('b','',f.name));lead.appendChild(lt);lead.appendChild(el('div','big',fm(f.total)));c.appendChild(lead);
  c.appendChild(el('p','mute',r.list.length+' penyanyi dinilai. Skor = rata-rata Suara, Gaya, dan Interaksi (maks 10).'));
  r.list.forEach((x,i)=>{
   const row=el('div','rank');row.appendChild(el('div','no',String(i+1)));
   const m=el('div');m.appendChild(el('b','',x.name));
   m.appendChild(el('small','','Suara '+fm(x.suara)+' · Gaya '+fm(x.gaya)+' · Interaksi '+fm(x.interaksi)+' · '+x.n+' penilai'));row.appendChild(m);
   row.appendChild(el('div','tot',fm(x.total)));c.appendChild(row);
  });
  const rf=el('button','ref','Perbarui');rf.type='button';rf.onclick=render;c.appendChild(rf);
 }).catch(e=>{c.textContent='';c.appendChild(el('div','msg err','Gagal memuat: '+errMsg(e)))});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0)});
call('data').then(d=>{D=d;render()}).catch(e=>{$('#view').textContent='';const c=el('div','card');c.appendChild(el('div','msg err','Gagal memuat data: '+errMsg(e)));const b=el('button','go','Coba lagi');b.onclick=()=>location.reload();c.appendChild(b);$('#view').appendChild(c)});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body></html>
