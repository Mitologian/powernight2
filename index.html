<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Power Night 2"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Power Night 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;--fg:#1a1a1a;--mute:#5f5f5f;--line:#e6e6e6;--soft:#f4f4f4;--red:#c8102e;--redd:#a60d26;
--blue-bg:#e6eefc;--blue:#2f6fde;--blue-d:#1f4fa8;--teal-bg:#e3f4f4;--teal:#0f8b8d;--teal-d:#0b6466;--amber-bg:#fff3d6;--amber:#f2a900;--amber-d:#7a5a00;
--green-bg:#e4f4ea;--green:#2e9b5f;--green-d:#1e6b40;--purple-bg:#f1eafb;--purple:#7c4dc4;--purple-d:#5b34a0;--orange-bg:#fde9e0;--orange-d:#a64b1a;--pink-bg:#fce6f0;--pink-d:#a61e5a}
*{box-sizing:border-box}
body{margin:0;-webkit-tap-highlight-color:transparent;background:#fff;color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.banner{position:relative;background:#2b3a2c;line-height:0;padding-top:env(safe-area-inset-top,0px)}
.banner img{width:100%;height:auto;aspect-ratio:1000/460;max-height:300px;object-fit:cover;object-position:center 45%;display:block}
.banner h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
.sub{position:absolute;left:16px;bottom:14px;line-height:1.2;background:var(--red);color:#fff;font-size:14px;font-weight:600;border-radius:999px;padding:6px 16px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
main{max-width:560px;margin:0 auto;padding:0 20px 24px}
#view>*{animation:pop .2s ease both}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){#view>*{animation:none}}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 -20px;padding:0 20px;position:sticky;top:0;background:#fff;z-index:5}
.tabs button{flex:1;border:0;background:none;padding:15px 2px 12px;font:inherit;font-size:14px;font-weight:400;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-pressed="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.25}}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:8}
nav button{border:0;background:none;padding:4px 2px;min-height:48px;font:inherit;font-size:11.5px;color:var(--mute);cursor:pointer;font-weight:500;display:grid;justify-items:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--red)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mute{color:var(--mute);font-size:13.5px;margin:12px 0 0}
h2{font-size:18px;margin:26px 0 0;font-weight:600}
.stack{display:grid;gap:12px;margin-top:14px}
.hl{margin-top:18px;border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ic.sq{border-radius:12px}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hl .k{font-size:11px;font-weight:600;letter-spacing:.1em}
.hl .v{font-weight:600;font-size:17px;line-height:1.2;margin-top:2px}
.hl .s{font-size:12.5px;margin-top:2px;opacity:.85}
.hl .r{margin-left:auto;font-weight:600;font-size:17px;white-space:nowrap}
.c-amber{background:var(--amber-bg);color:var(--amber-d)}.c-amber .ic{background:var(--amber);color:#fff}
.c-teal{background:var(--teal-bg);color:var(--teal-d)}.c-teal .ic{background:var(--teal);color:#fff}
.c-green{background:var(--green-bg);color:var(--green-d)}.c-green .ic{background:var(--green);color:#fff}
.c-purple{background:var(--purple-bg);color:var(--purple-d)}.c-purple .ic{background:var(--purple);color:#fff}
.c-blue{background:var(--blue-bg);color:var(--blue-d)}.c-blue .ic{background:var(--blue);color:#fff}
.hl .v,.hl .s{color:var(--fg)}
.row{display:flex;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;align-items:center}
.row .b{flex-grow:1;min-width:0}.row b{font-weight:600;font-size:15px;display:block}.row small{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.row .t{font-weight:600;font-size:14px;color:#444;white-space:nowrap}
.ic.c-amber{background:var(--amber-bg);color:var(--amber-d)}.ic.c-teal{background:var(--teal-bg);color:var(--teal-d)}.ic.c-green{background:var(--green-bg);color:var(--green-d)}.ic.c-purple{background:var(--purple-bg);color:var(--purple-d)}.ic.c-blue{background:var(--blue-bg);color:var(--blue-d)}.ic.c-orange{background:var(--orange-bg);color:var(--orange-d)}.ic.c-gray{background:var(--soft);color:#444}
.tm{margin-top:22px}
.tmh{border-radius:14px 14px 0 0;padding:12px 14px;background:var(--teal-bg);color:var(--teal-d)}
.tmh b{display:block;font-size:16px;font-weight:600;color:var(--fg)}.tmh small{font-size:12.5px;color:var(--teal-d)}
.tmb{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:6px 12px;display:grid}
.mem{display:flex;align-items:center;gap:14px;padding:10px 2px}
.mem+.mem{border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--teal-bg);color:var(--teal-d);flex-shrink:0}
.mem span{font-weight:500;font-size:15px}
.mem.me{background:var(--amber-bg);border-radius:10px;padding-left:8px;margin:2px 0}
input[type=search],select,input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;padding:14px;border:1px solid #cfcfcf;border-radius:10px;background:#fff;color:var(--fg)}
label.l{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:20px 0 8px}
.score{margin-top:20px;border-radius:14px;padding:16px;text-align:center;background:var(--purple-bg);color:var(--purple-d)}
.score .k{font-size:11px;font-weight:600;letter-spacing:.1em}.score .n{font-size:56px;font-weight:600;line-height:1.1}.score .s{font-size:12.5px;color:#555}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.chips button{height:48px;border:0;border-radius:12px;background:#f1f1f1;font:inherit;font-size:17px;font-weight:600;color:#333;cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--purple);color:#fff}
.go{width:100%;margin-top:20px;border:0;border-radius:10px;background:var(--red);color:#fff;font:inherit;font-weight:600;font-size:16px;padding:15px;min-height:50px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.msg{padding:12px;border-radius:10px;font-size:15px;margin-top:14px}.err{background:#fde8ec;color:#8a1020}.okm{background:#e3f4ea;color:#0d5a2d}
.empty{text-align:center;color:var(--mute);padding:36px 8px}
.ref{border:1px solid #cfcfcf;background:#fff;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;margin-top:16px}
.rk{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.rk .n{font-weight:600;font-size:17px;color:var(--purple)}.rk b{font-weight:500;font-size:15px;display:block}.rk small{font-size:12px;color:var(--mute)}.rk .s{font-weight:600;font-size:19px}
.vs{padding:12px 14px;border:1px solid var(--line);border-radius:12px;display:grid;gap:4px}
.vs .t{display:flex;justify-content:space-between;gap:10px;align-items:center}.vs b{font-weight:600;font-size:15px}.vs i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mute)}
.use{border:1px solid var(--red);color:var(--red);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-weight:500;font-size:14px;cursor:pointer}
.pill{display:inline-block;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:6px;background:var(--soft);color:var(--mute);margin:6px 6px 0 0}
.grow{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.del{border:1px solid #cfcfcf;background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;color:var(--red);cursor:pointer}
.logrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.radios button{padding:13px 6px;min-height:48px;border:1px solid #cfcfcf;border-radius:10px;background:#fff;font:inherit;font-weight:500;font-size:14px;cursor:pointer;color:var(--fg)}
.radios button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.sec{display:flex;align-items:center;gap:10px;margin-top:26px}
.sec b{font-size:16px;font-weight:600}.sec span{font-size:12.5px;color:var(--mute)}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
.room{border:1px solid #dadada;border-radius:14px;overflow:hidden;background:#fff}
.room.hit{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.rh{padding:10px 12px}.rh b{display:block;font-size:20px;font-weight:600;line-height:1.1}.rh small{font-size:11.5px;font-weight:500}
.rn{padding:10px;display:grid;gap:8px}
.nm{background:#f4f4f4;border-radius:8px;padding:8px 10px;font-weight:500;font-size:13px;line-height:1.2;min-height:46px;display:flex;align-items:center}
.nm.fam{background:#fff;border:1px dashed #bdbdbd;color:var(--purple-d);font-weight:500}
.wheelw{position:relative;width:min(300px,100%);margin:22px auto 0}
.wheel{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 4px 18px rgba(0,0,0,.12)}.wheel.on{cursor:pointer;box-shadow:0 0 0 4px var(--amber),0 4px 18px rgba(0,0,0,.12)}
.ptr{position:absolute;left:50%;top:-10px;width:0;height:0;margin-left:-12px;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--fg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.vsb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.vsm{align-self:center;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.08em}
.side{background:#f4f4f4;border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:64px}
.side b{font-size:14px;font-weight:600;line-height:1.25}.side small{font-size:11px;font-weight:600;letter-spacing:.1em;margin-top:4px}
.side.win{background:var(--green-bg);color:var(--green-d)}.side.lose{opacity:.55}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:grid;place-items:center;padding:20px}
.mod{background:#fff;border-radius:16px;padding:22px;width:min(380px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.mrow .go,.mrow .ref{margin-top:0;min-height:50px;font-weight:600}
</style></head>
<body>
<header class="banner"><img src="hero.jpg" alt="Power Night 2, BNI Grow, Driam Riverside Ciwidey" width="1000" height="460" fetchpriority="high"><h1>Power Night 2</h1><div class="sub" id="sub">Rundown</div></header>
<main id="view"><div class="empty">Memuat...</div></main>
<nav role="tablist">
<button role="tab" data-t="rundown" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Rundown</span></button>
<button role="tab" data-t="kamar" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V9l9-6 9 6v11zM9 20v-6h6v6"/></svg><span>Kamar</span></button>
<button role="tab" data-t="idol" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3"/></svg><span>Grow Idol</span></button>
<button role="tab" data-t="team" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3 3 0 010 5.6M18 14.3c1.8.8 3 2.6 3 4.7"/></svg><span>Team</span></button>
</nav>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const API=window.PN_API||'';
const IC={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',home:'<path d="M3 20V9l9-6 9 6v11zM9 20v-6h6v6"/>',users:'<path d="M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3 3 0 010 5.6M18 14.3c1.8.8 3 2.6 3 4.7"/>',flame:'<path d="M12 3c1 3 4 4 4 8a4 4 0 01-8 0c0-2 1-3 2-4 0 2 1 2 1 1 0-2 0-3 1-5zM8 21h8"/>',mic:'<path d="M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3"/>',trophy:'<path d="M7 4h10v5a5 5 0 01-10 0zM7 6H4v1a3 3 0 003 3M17 6h3v1a3 3 0 01-3 3M12 14v4M8 20h8"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',food:'<path d="M6 3v8a2 2 0 002 2v8M10 3v6M6 7h4M17 3c-2 2-3 5-3 8h3v10"/>',bed:'<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 00-3-3h-7v5"/>'};
function svg(name){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.innerHTML=IC[name]||IC.clock;return s}
function icon(name,color,sq){const d=el('div','ic c-'+color+(sq?' sq':''));d.appendChild(svg(name));return d}
let D=null,K=null,tab='rundown',rDay='',kSeg='lawan',gSeg='nilai',score=0,chosen='',q='',kq='',timer=null;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let dev=store('pn_dev');
if(!dev){dev=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));store('pn_dev',dev)}
function voted(){try{return JSON.parse(store('pn_voted')||'[]')}catch(e){return[]}}
function addVoted(n){const v=voted();if(!v.includes(n)){v.push(n);store('pn_voted',JSON.stringify(v))}}
async function call(action,body){
 if(!API)throw new Error('Alamat API belum diisi di config.js');
 let r;
 if(body){r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},body))})}
 else{r=await fetch(API+'?action='+action)}
 const j=await r.json();
 if(!j.ok)throw new Error(j.error||'Terjadi kesalahan');
 return j.data;
}
const errMsg=e=>String((e&&e.message)||e).replace(/^Error:\s*/,'');
function msg(parent,t,ok){let m=parent.querySelector('.msg');if(!m){m=el('div','msg');parent.appendChild(m)}m.className='msg '+(ok?'okm':'err');m.textContent=t}
const fm=x=>Number(x).toFixed(1).replace('.',',');
function tabsBar(items,cur,on){const t=el('div','tabs');items.forEach(([k,n,live])=>{const b=el('button','');b.type='button';if(live)b.appendChild(el('span','dot'));b.appendChild(document.createTextNode(n));b.setAttribute('aria-pressed',k===cur);b.onclick=()=>on(k);t.appendChild(b)});return t}
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');

function render(){
 clearInterval(timer);timer=null;
 const v=$('#view');v.textContent='';
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
 $('#sub').textContent={rundown:'Rundown',team:'Team',idol:gSeg==='nilai'?'Grow Idol · Nilai':'Grow Idol · Ranking live',kamar:'Kamar'}[tab];
 if(!D){v.appendChild(el('div','empty','Memuat...'));return}
 ({rundown:rRundown,team:rTeam,idol:rIdol,kamar:rKamar})[tab](v);
}

/* RUNDOWN */
function evIcon(t){t=t.toLowerCase();
 if(/check.?in|kamar|room/.test(t))return['home','green'];
 if(/karaoke|idol|nyanyi/.test(t))return['mic','purple'];
 if(/barbe|bbq|makan|dinner|lunch|sarapan|breakfast|coffee/.test(t))return['flame','amber'];
 if(/paintball/.test(t))return['target','blue'];
 if(/game|lomba|outing/.test(t))return['trophy','orange'];
 if(/meeting|conclave|121|briefing|welcome|sharing|training/.test(t))return['users','teal'];
 return['clock','gray'];
}
function minutes(t){const m=String(t||'').match(/(\d{1,2})[.:](\d{2})/);return m?(+m[1])*60+(+m[2]):null}
function nowEvent(items){
 const n=new Date();if(n.getFullYear()!==2026||n.getMonth()!==10)return null;
 const today=items.filter(r=>{const d=String(r.day).match(/\d+/);return d&&+d[0]===n.getDate()});
 const cur=n.getHours()*60+n.getMinutes();let found=null;
 today.forEach(r=>{const m=minutes(r.time);if(m!==null&&m<=cur)found=r});
 return found;
}
function rRundown(v){
 if(!D.rundown.length){v.appendChild(el('div','empty','Rundown belum diisi panitia.'));return}
 const days=[];D.rundown.forEach(r=>{if(!days.includes(r.day))days.push(r.day)});
 if(!days.includes(rDay)){const n=nowEvent(D.rundown);rDay=n?n.day:days[0]}
 v.appendChild(tabsBar(days.map(d=>[d,d||'Rundown']),rDay,d=>{rDay=d;render()}));
 const now=nowEvent(D.rundown);
 if(now&&now.day===rDay){const h=el('div','hl c-amber');h.appendChild(icon('clock','amber'));const b=el('div');b.appendChild(el('div','k','SEDANG BERLANGSUNG'));b.appendChild(el('div','v',now.title));h.appendChild(b);h.appendChild(el('div','r',now.time));v.appendChild(h)}
 const st=el('div','stack');v.appendChild(st);
 D.rundown.filter(r=>r.day===rDay).forEach(r=>{
  const [i,c]=evIcon(r.title);const row=el('div','row');row.appendChild(icon(i,c,true));
  const b=el('div','b');b.appendChild(el('b','',r.title));const s=[r.note,r.place].filter(Boolean).join(' · ');if(s)b.appendChild(el('small','',s));row.appendChild(b);
  row.appendChild(el('div','t',r.time));st.appendChild(row);
 });
}

/* TEAM */
function rTeam(v){
 v.appendChild(tabsBar([['undi','Undi lawan'],['lawan','Pertandingan']],kSeg,k=>{kSeg=k;render()}));
 const body=el('div');v.appendChild(body);
 ({undi:tUndi,lawan:tLawan})[kSeg](body);
}
const shortN=n=>{const m=String(n).match(/^team\s*\d+/i);return m?m[0]:String(n).split(/\s+/).slice(0,2).join(' ')};
function pinModal(title,run){
 const ov=el('div','ov'),bx=el('div','mod');ov.appendChild(bx);
 const h=el('h2','',title);h.style.marginTop='0';bx.appendChild(h);
 bx.appendChild(el('p','mute','Khusus panitia. Masukkan PIN panitia.'));
 const i=el('input');i.type='password';i.inputMode='numeric';i.placeholder='PIN panitia';i.setAttribute('aria-label','PIN panitia');i.autocomplete='off';i.style.marginTop='14px';bx.appendChild(i);
 const row=el('div','mrow');const cn=el('button','ref','Batal');cn.type='button';const ok=el('button','go','Lanjut');ok.type='button';row.appendChild(cn);row.appendChild(ok);bx.appendChild(row);
 cn.onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};
 i.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')ov.remove()};
 ok.onclick=()=>{ok.disabled=true;Promise.resolve().then(()=>run(i.value)).then(()=>ov.remove()).catch(e=>{ok.disabled=false;msg(bx,errMsg(e),false);i.select()})};
 document.body.appendChild(ov);i.focus();
}
const WCOL=['#C8102E','#f6c453','#35a99a','#4b8bd6','#7c4dc4','#e8833a','#d9568f','#2e9b5f'];
let uA='',spinning=false,rot=0;
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function drawWheel(cv,names){
 const S=cv.width,ctx=cv.getContext('2d'),r=S/2;ctx.clearRect(0,0,S,S);
 if(!names.length){ctx.fillStyle='#f1f1f1';ctx.beginPath();ctx.arc(r,r,r-4,0,7);ctx.fill();ctx.fillStyle='#777';ctx.font='500 26px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('Pilih tim pertama',r,r+8);return}
 const n=names.length,a=2*Math.PI/n;
 names.forEach((nm,i)=>{
  ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r-4,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);ctx.closePath();ctx.fillStyle=WCOL[i%WCOL.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();
  ctx.save();ctx.translate(r,r);ctx.rotate(-Math.PI/2+(i+.5)*a);ctx.textAlign='right';ctx.fillStyle=(i%WCOL.length===1)?'#3a2a00':'#fff';ctx.font='600 '+(n>8?22:28)+'px Inter,sans-serif';ctx.fillText(shortN(nm),r-26,9);ctx.restore();
 });
 ctx.beginPath();ctx.arc(r,r,34,0,7);ctx.fillStyle='#fff';ctx.fill();
}
function tUndi(v){
 rot=0;spinning=false;
 const c=el('div');v.appendChild(c);
 c.appendChild(el('p','mute','Memuat...'));
 call('klasemen').then(k=>{
  c.textContent='';
  const taken=[];k.matches.forEach(x=>taken.push(x.a,x.b));
  const free=D.groups.filter(g=>!taken.includes(g));
  if(!D.groups.length){c.appendChild(el('div','empty','Isi tim di tab Kelompok pada sheet dulu.'));return}
  if(free.length<2){c.appendChild(el('div','empty',free.length?free[0]+' tidak punya lawan (jumlah tim ganjil).':'Semua tim sudah punya lawan. Lihat tab Pertandingan.'));return}
  uA='';let pick='';
  const lab=el('label','l','Tim pertama');lab.htmlFor='ua';c.appendChild(lab);
  const sel=el('select');sel.id='ua';const o0=el('option','','Pilih tim');o0.value='';sel.appendChild(o0);free.forEach(g=>{const o=el('option','',g);o.value=g;sel.appendChild(o)});c.appendChild(sel);
  const wrap=el('div','wheelw');const cv=el('canvas','wheel');cv.width=600;cv.height=600;cv.setAttribute('role','button');cv.tabIndex=0;cv.setAttribute('aria-label','Roda undian. Tap untuk memutar');wrap.appendChild(cv);wrap.appendChild(el('div','ptr'));c.appendChild(wrap);
  const hint=el('p','mute','Pilih tim pertama, lalu tap roda untuk mendapatkan lawannya.');hint.style.textAlign='center';c.appendChild(hint);
  const res=el('div');c.appendChild(res);
  const opp=()=>uA?free.filter(g=>g!==uA):free;
  function sync(){drawWheel(cv,opp());cv.classList.toggle('on',!!uA&&!spinning)}
  sel.onchange=()=>{uA=sel.value;pick='';rot=0;cv.style.transition='none';cv.style.transform='none';res.textContent='';hint.style.display='';sync()};
  sync();
  function spin(){
   if(spinning||!uA||pick){if(!uA)msg(res,'Pilih tim pertama dulu.',false);return}
   spinning=true;sel.disabled=true;res.textContent='';cv.classList.remove('on');
   const os=opp(),n=os.length,w=rnd(n),s=360/n,jit=(Math.random()-.5)*s*.6;
   const target=((360-(w+.5)*s-jit)%360+360)%360,cur=((rot%360)+360)%360;
   rot=rot+360*6+((target-cur)+360)%360;
   const dur=matchMedia('(prefers-reduced-motion:reduce)').matches?300:5000;
   cv.style.transition='transform '+dur+'ms cubic-bezier(.1,.55,.1,1)';cv.style.transform='rotate('+rot+'deg)';
   const a=uA,b=os[w];
   setTimeout(()=>{
    spinning=false;pick=b;hint.style.display='none';res.textContent='';
    const card=el('div','hl c-green');card.appendChild(icon('target','green'));const t=el('div');t.appendChild(el('div','k','HASIL UNDIAN'));t.appendChild(el('div','v',a+' vs '+b));card.appendChild(t);res.appendChild(card);
    const set=el('button','go','Set pertandingan');set.type='button';res.appendChild(set);
    set.onclick=()=>pinModal('Set pertandingan',p=>call('pasangan',{pin:p,a,b}).then(()=>{res.textContent='';msg(res,a+' vs '+b+' masuk ke Pertandingan.',true);const nx=el('button','go','Undi tim berikutnya');nx.type='button';nx.onclick=()=>{uA='';render()};res.appendChild(nx)}));
   },dur+250);
  }
  cv.onclick=spin;cv.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();spin()}};
 }).catch(e=>{c.textContent='';msg(c,'Gagal memuat: '+errMsg(e),false)});
}
function tLawan(v){
 const box=el('div');v.appendChild(box);
 function load(){return call('klasemen').then(draw).catch(e=>{box.textContent='';box.appendChild(el('div','msg err','Gagal memuat: '+errMsg(e)))})}
 function draw(k){
  box.textContent='';
  if(!k.matches.length){box.appendChild(el('div','empty','Belum ada pasangan. Lawan ditentukan lewat undian roda oleh panitia.'));return}
  const done=k.matches.filter(m=>m.winner).length;
  box.appendChild(el('p','mute',k.matches.length+' pertandingan · '+done+' sudah ada pemenang'));
  k.matches.forEach((m,i)=>{
   const w=el('section','tm');const h=el('div','tmh');h.style.background='var(--blue-bg)';h.appendChild(el('b','','Pertandingan '+(i+1)));const sm=el('small','',m.winner?'Selesai':'Belum ada hasil');sm.style.color='var(--blue-d)';h.appendChild(sm);w.appendChild(h);
   const b=el('div','tmb');b.style.padding='12px';
   const vs=el('div','vsb');
   [m.a,m.b].forEach((nm,j)=>{
    if(j===1)vs.appendChild(el('span','vsm','VS'));
    const sd=el('div','side'+(m.winner===nm?' win':(m.winner?' lose':'')));sd.appendChild(el('b','',nm));if(m.winner===nm)sd.appendChild(el('small','','MENANG'));vs.appendChild(sd);
   });b.appendChild(vs);
   const rd=el('div','radios');rd.style.marginTop='12px';
   [['A',m.a],['B',m.b]].forEach(([key,nm])=>{const x=el('button','',shortN(nm)+' menang');x.type='button';x.setAttribute('aria-pressed',m.winner===nm);x.onclick=()=>pinModal('Tandai pemenang',p=>call('menang',{pin:p,id:m.id,result:m.winner===nm?'':key}).then(load));rd.appendChild(x)});b.appendChild(rd);
   const dl=el('button','del','Hapus pasangan');dl.type='button';dl.style.marginTop='12px';dl.onclick=()=>pinModal('Hapus pasangan '+shortN(m.a)+' vs '+shortN(m.b),p=>call('hapus',{pin:p,kind:'pb',id:m.id}).then(load));b.appendChild(dl);
   w.appendChild(b);box.appendChild(w);
  });
 }
 box.appendChild(el('p','mute','Memuat...'));load();
 timer=setInterval(load,8000);
}

 v.appendChild(tabsBar([['nilai','Nilai'],['rank','Ranking live',gSeg==='rank']],gSeg,k=>{gSeg=k;render()}));

function gNilai(c){
 if(!D.open){c.appendChild(el('div','msg err','Penilaian sedang ditutup panitia.'));return}
 const done=voted();
 const lab=el('label','l','Penilaian untuk siapa');lab.htmlFor='sg';c.appendChild(lab);
 const s=el('select');s.id='sg';
 const o0=el('option','','Pilih nama penyanyi');o0.value='';s.appendChild(o0);
 D.singers.forEach(x=>{const o=el('option','',(done.includes(x.name)?'✓ ':'')+x.name);o.value=x.name;s.appendChild(o)});
 s.value=chosen;c.appendChild(s);
 const sc=el('div','score');sc.appendChild(el('div','k','SKOR DARI ANDA'));const num=el('div','n',score||'-');sc.appendChild(num);sc.appendChild(el('div','s','Suara, gaya, dan interaksi penonton'));c.appendChild(sc);
 const ch=el('div','chips');
 const btn=el('button','go','Kirim nilai');btn.type='button';
 for(let i=1;i<=10;i++){const b=el('button','',String(i));b.type='button';b.setAttribute('aria-pressed',score===i);b.onclick=()=>{score=i;num.textContent=i;ch.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));check()};ch.appendChild(b)}
 c.appendChild(ch);
 function check(){btn.disabled=!(chosen&&score&&!voted().includes(chosen))}
 s.onchange=()=>{chosen=s.value;const m=c.querySelector('.msg');if(m)m.remove();if(voted().includes(chosen))msg(c,'Anda sudah menilai '+chosen+'.',false);check()};
 btn.onclick=()=>{
  btn.disabled=true;btn.textContent='Mengirim...';
  call('rate',{singer:chosen,suara:score,gaya:score,interaksi:score,device:dev}).then(()=>{
   addVoted(chosen);const n=chosen;chosen='';score=0;gDone(n);
  }).catch(e=>{const m=errMsg(e);if(/sudah menilai/.test(m))addVoted(chosen);msg(c,m,false);btn.textContent='Kirim nilai';check()});
 };
 c.appendChild(btn);btn.disabled=true;check();
}

const TYPES=[['Deluxe Room','blue'],['Deluxe Riverview','teal'],['Family Riverview','amber'],['Family Barrack','orange'],['Driam Suite','purple'],['Glamping','green'],['Deluxe Luxcamp','pink']];
function rKamar(v){
 const s=el('input');s.type='search';s.placeholder='Cari nama atau nomor kamar';s.value=kq;s.style.marginTop='18px';s.setAttribute('aria-label','Cari kamar');v.appendChild(s);
 const list=el('div');v.appendChild(list);
 if(!K){list.appendChild(el('p','mute','Memuat kamar...'));
  call('kamar').then(d=>{K=d.rooms||[];render()}).catch(e=>{list.textContent='';list.appendChild(el('div','msg err','Data kamar belum tersedia ('+errMsg(e)+'). Perbarui Apps Script ke versi terbaru.'))});return}
 s.oninput=()=>{kq=s.value;draw()};draw();
 function draw(){
  list.textContent='';const nd=kq.trim().toLowerCase();
  const rooms=K.filter(r=>!nd||(r.no+' '+r.names.join(' ')).toLowerCase().includes(nd));
  if(!rooms.length){list.appendChild(el('div','empty',K.length?'Tidak ada yang cocok.':'Data kamar belum diisi.'));return}
  if(nd){const f=rooms[0];const h=el('div','hl c-green');h.appendChild(icon('bed','green'));const b=el('div');b.appendChild(el('div','k','KAMAR DITEMUKAN'));b.appendChild(el('div','v','Kamar '+f.no));b.appendChild(el('div','s',f.type));h.appendChild(b);list.appendChild(h)}
  else{const h=el('div','hl c-green');h.appendChild(icon('bed','green'));const b=el('div');b.appendChild(el('div','k','KAMAR ANDA'));b.appendChild(el('div','v','Cari nama Anda di kotak atas'));h.appendChild(b);list.appendChild(h)}
  const order=TYPES.map(t=>t[0]);
  const types=[...new Set(rooms.map(r=>r.type))].sort((a,b)=>{const x=order.indexOf(a),y=order.indexOf(b);return (x<0?99:x)-(y<0?99:y)});
  types.forEach(t=>{
   const col=(TYPES.find(x=>x[0]===t)||[0,'gray'])[1];const rs=rooms.filter(r=>r.type===t).sort((a,b)=>a.no.localeCompare(b.no,undefined,{numeric:true}));
   const sec=el('div','sec');sec.appendChild(icon('bed',col));sec.appendChild(el('b','',t));sec.appendChild(el('span','',rs.length+' kamar'));list.appendChild(sec);
   const g=el('div','rooms');
   rs.forEach(r=>{
    const hit=nd&&(r.no+' '+r.names.join(' ')).toLowerCase().includes(nd);
    const w=el('div','room'+(hit?' hit':''));const h=el('div','rh c-'+col);h.appendChild(el('b','',r.no));h.appendChild(el('small','',r.type));w.appendChild(h);
    const n=el('div','rn');r.names.forEach(x=>n.appendChild(el('div','nm',x)));
    if(r.family)n.appendChild(el('div','nm fam','Keluarga ('+r.family+' orang)'));
    w.appendChild(n);g.appendChild(w);
   });
   list.appendChild(g);
  });
 }
}
