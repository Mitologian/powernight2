<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Power Night 2"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Power Night 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;--bg:#f5f5f7;--card:#fff;--fg:#1a1a1a;--mute:#6b6b73;--line:#ececf0;--soft:#f1f1f4;--field:#d9d9df;--seg:#e9e9ee;--track:#e6e6ec;
--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);
--red:#c8102e;--redd:#a60d26;--red-t:#c8102e;--red-soft:#fde7eb;
--blue-bg:#e6eefc;--blue:#2f6fde;--blue-d:#1f4fa8;--teal-bg:#e3f4f4;--teal:#0f8b8d;--teal-d:#0b6466;--amber-bg:#fff3d6;--amber:#f2a900;--amber-d:#7a5a00;
--green-bg:#e4f4ea;--green:#2e9b5f;--green-d:#1e6b40;--purple-bg:#f1eafb;--purple:#7c4dc4;--purple-d:#5b34a0;--orange:#ec8a3d;--orange-bg:#fde9e0;--orange-d:#a64b1a;--pink-bg:#fce6f0;--pink-d:#a61e5a;--indigo-bg:#e8eafd;--indigo-d:#2c3590;
--gold:#f6e3a1;--silver:#e1e4ea;--bronze:#efcfb3;--err-bg:#fde8ec;--err-t:#8a1020;--ok-bg:#e3f4ea;--ok-t:#0d5a2d;
--m-cor:#e9e9ee;--m-a:#fff;--m-b:#f6f6f8;--m-stk:#bdbdc4;--m-txt:#444;--m-txt2:#555;--m-wfill:#d6e6fb;--m-wstk:#94b6ec;--m-wtxt:#1f4fa8}
*{box-sizing:border-box}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.banner{position:relative;background:#2b3a2c;line-height:0;padding-top:env(safe-area-inset-top,0px);border-radius:0 0 28px 28px;overflow:hidden}
.banner img{width:100%;height:auto;aspect-ratio:1000/460;max-height:300px;object-fit:cover;object-position:center 45%;display:block}
.banner h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
.sub{position:absolute;left:16px;bottom:16px;line-height:1.2;background:var(--red);color:#fff;font-size:14px;font-weight:600;border-radius:999px;padding:6px 16px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.adm{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.38);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.adm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.adm[aria-pressed="true"]{background:var(--red)}
.adm.loc{right:60px}
main{max-width:560px;margin:0 auto;padding:0 16px 24px}
#view>*{animation:pop .2s ease both}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){#view>*{animation:none}}
.tabs{display:flex;gap:2px;background:var(--seg);border-radius:15px;padding:4px;margin:18px 0 0;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;font:inherit;font-size:14px;font-weight:500;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.14)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.25}}
nav{position:fixed;left:14px;right:14px;max-width:532px;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:64px;background:var(--card);border-radius:24px;box-shadow:0 2px 6px rgba(16,24,40,.08),0 12px 32px rgba(16,24,40,.16);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;z-index:8}
nav button{border:0;background:none;padding:0;border-radius:18px;font:inherit;font-size:10.5px;color:var(--mute);cursor:pointer;font-weight:500;display:grid;justify-items:center;align-content:center;gap:2px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--red-t);background:var(--red-soft);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mapw{margin-top:14px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:var(--soft)}
.mapw iframe{display:block;width:100%;height:280px;border:0}
.addr{display:flex;gap:12px;align-items:flex-start;margin-top:14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.addr b{display:block;font-weight:600;font-size:16px}.addr small{display:block;font-size:13px;color:var(--mute);margin-top:2px;line-height:1.4}
.fac{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.fc{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px}
.fc .ib{margin-bottom:8px}.fc b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}.fc small{display:block;font-size:12px;color:var(--mute);margin-top:2px;line-height:1.3}
.lockw{position:relative;margin-top:4px}
.lk{filter:blur(6px);opacity:.75;user-select:none;pointer-events:none}
.lov{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:70px 20px 0;background:linear-gradient(rgba(245,245,247,.15),rgba(245,245,247,.7))}
.lbox{background:var(--card);border-radius:20px;box-shadow:0 8px 30px rgba(16,24,40,.16);padding:20px 22px;text-align:center;max-width:300px}
.lbox b{display:block;font-size:16px;font-weight:600;line-height:1.4;margin-top:10px}
.lic{width:46px;height:46px;border-radius:50%;background:var(--orange-bg);color:var(--orange-d);display:grid;place-items:center;margin:0 auto}
.lic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.intro{display:flex;gap:14px;align-items:center;margin:22px 0 4px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.intro .tr{width:44px;height:44px;border-radius:14px;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.intro .tr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.intro p{margin:0;font-size:15.5px;line-height:1.4}.intro p b{display:block;font-weight:700;margin-top:2px;color:var(--orange-d)}
.mute{color:var(--mute);font-size:13.5px;margin:12px 0 0}
h2{font-size:18px;margin:26px 0 0;font-weight:600}
.stack{display:grid;gap:10px;margin-top:14px}
.hl{margin-top:16px;border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ic.sq{border-radius:12px}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hl .k{font-size:11px;font-weight:600;letter-spacing:.1em}
.hl .v{font-weight:600;font-size:17px;line-height:1.2;margin-top:2px}
.hl .s{font-size:12.5px;margin-top:2px;opacity:.85}
.hl .r{margin-left:auto;font-weight:600;font-size:17px;white-space:nowrap}
.c-amber{background:var(--amber-bg);color:var(--amber-d)}.c-amber .ic{background:var(--amber);color:#fff}
.c-teal{background:var(--teal-bg);color:var(--teal-d)}.c-teal .ic{background:var(--teal);color:#fff}
.c-green{background:var(--green-bg);color:var(--green-d)}.c-green .ic{background:var(--green);color:#fff}
.c-orange{background:var(--orange-bg);color:var(--orange-d)}.c-orange .ic{background:var(--orange);color:#fff}
.c-purple{background:var(--purple-bg);color:var(--purple-d)}.c-purple .ic{background:var(--purple);color:#fff}
.c-blue{background:var(--blue-bg);color:var(--blue-d)}.c-blue .ic{background:var(--blue);color:#fff}
.hl .v,.hl .s{color:var(--fg)}
.rt{margin-top:16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.rth{display:grid;grid-template-columns:50px 4px 1fr;gap:10px;padding:12px 14px 9px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mute)}
.rtr{display:grid;grid-template-columns:50px 4px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.rtr .tt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtr .bar{align-self:stretch;min-height:30px;width:4px;border-radius:4px;opacity:.85}
.rtr b{display:block;font-weight:600;font-size:15px;line-height:1.25}.rtr small{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.rtr.live{background:#ececf0}.rtr.live .tt{color:var(--red-t)}
.livep{background:var(--red);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;border-radius:999px;padding:3px 9px}
.bc-amber{background:var(--amber)}.bc-teal{background:var(--teal)}.bc-green{background:var(--green)}.bc-orange{background:var(--orange)}.bc-blue{background:var(--blue)}.bc-purple{background:var(--purple)}.bc-gray{background:var(--field)}
.ic.c-amber{background:var(--amber-bg);color:var(--amber-d)}.ic.c-teal{background:var(--teal-bg);color:var(--teal-d)}.ic.c-green{background:var(--green-bg);color:var(--green-d)}.ic.c-purple{background:var(--purple-bg);color:var(--purple-d)}.ic.c-blue{background:var(--blue-bg);color:var(--blue-d)}.ic.c-orange{background:var(--orange-bg);color:var(--orange-d)}.ic.c-gray{background:var(--soft);color:var(--mute)}
.rsp{border-top:1px solid var(--line)}
.rsh{display:grid;grid-template-columns:1fr 1fr}.rsh span{font-size:11px;font-weight:600;letter-spacing:.1em;text-align:center;padding:7px 4px}
.rsh .m{background:var(--blue-bg);color:var(--blue-d)}.rsh .k{background:var(--pink-bg);color:var(--pink-d)}
.rsc{display:grid;grid-template-columns:1fr 1fr}.rsc>div+div{border-left:1px solid var(--line)}
.si{padding:11px 12px}.si+.si{border-top:1px solid var(--line)}.si.live{background:var(--red-soft)}
.si .tt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}.si.live .tt{color:var(--red-t)}
.si b{display:block;font-weight:600;font-size:14px;line-height:1.25;margin-top:2px}.si small{display:block;font-size:12px;color:var(--mute);margin-top:2px;line-height:1.3}
.si .livep{font-size:9.5px;padding:2px 7px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.r2{display:grid;grid-template-columns:46px 34px 4px 1fr auto;gap:16px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.r2 .tt{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}.r2.live{background:#ececf0}.r2.live .tt{color:var(--red-t)}
.r2 b{display:block;font-weight:600;font-size:15px;line-height:1.25}.r2 small{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib.aM{background:var(--blue-bg);color:var(--blue-d)}.ib.aK{background:var(--pink-bg);color:var(--pink-d)}.ib.aS{background:var(--teal-bg);color:var(--teal-d)}
.r2.live .ib{background:var(--card)}
.r2 .bar{align-self:stretch;min-height:34px;width:4px;border-radius:4px}.r2 .bar.aM{background:var(--blue)}.r2 .bar.aK{background:#e0578f}.r2 .bar.aS{background:var(--teal)}
.rth.sp{grid-template-columns:46px 34px 4px 1fr;gap:16px}
.au{font-weight:600}.au.aM{color:var(--blue-d)}.au.aK{color:var(--pink-d)}.au.aS{color:var(--teal-d)}
.tm{margin-top:16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.tmh{padding:12px 14px;background:var(--blue-bg);color:var(--blue-d)}
.tmh b{display:block;font-size:16px;font-weight:600;color:var(--fg)}.tmh small{font-size:12.5px}
.tmb{padding:8px 14px;display:grid}
.tmh small{display:block;margin-top:1px}.tmh .cnt{float:right;font-size:12px;font-weight:600;opacity:.8}
.mem{display:flex;align-items:center;gap:12px;padding:10px 2px}.mem+.mem{border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;flex-shrink:0}
.mem span{font-weight:500;font-size:15px}.mem.me{background:var(--amber-bg);border-radius:10px;padding-left:8px;margin:2px 0}
.t-teal{background:var(--teal-bg);color:var(--teal-d)}.t-blue{background:var(--blue-bg);color:var(--blue-d)}.t-amber{background:var(--amber-bg);color:var(--amber-d)}.t-green{background:var(--green-bg);color:var(--green-d)}.t-purple{background:var(--purple-bg);color:var(--purple-d)}.t-orange{background:var(--orange-bg);color:var(--orange-d)}.t-pink{background:var(--pink-bg);color:var(--pink-d)}.t-indigo{background:var(--indigo-bg);color:var(--indigo-d)}
input[type=search],select,input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.sch{position:relative;margin-top:14px}
.sch svg{position:absolute;left:14px;top:50%;margin-top:-10px;width:20px;height:20px;fill:none;stroke:var(--mute);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sch input{padding-left:44px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 2px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}.stat span{font-size:11.5px;color:var(--mute)}
label.l{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:20px 0 8px}
.score{margin-top:16px;border-radius:18px;padding:16px 16px 14px;text-align:center;background:var(--card);box-shadow:var(--shadow)}
.score .k{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mute)}.score .s{font-size:12.5px;color:var(--mute);margin-top:6px}
.dialw{position:relative;width:240px;max-width:100%;margin:8px auto 0}
.dial{display:block;width:100%;height:auto}.dial path{fill:none;stroke-width:14;stroke-linecap:round}.dial .tr{stroke:var(--track)}.dial .pg{stroke:var(--orange);transition:stroke-dashoffset .35s ease,opacity .2s}
.dialw .n{position:absolute;left:0;right:0;bottom:0;font-size:52px;font-weight:700;line-height:1;color:var(--orange-d);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.dial .pg{transition:none}}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.chips button{height:48px;border:0;border-radius:14px;background:var(--card);box-shadow:0 1px 3px rgba(16,24,40,.1);font:inherit;font-size:17px;font-weight:600;color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--orange);color:#fff}
.go{width:100%;margin-top:20px;border:0;border-radius:14px;background:var(--red);color:#fff;font:inherit;font-weight:600;font-size:16px;padding:15px;min-height:50px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:14px;font-size:15px;margin-top:14px}.err{background:var(--err-bg);color:var(--err-t)}.okm{background:var(--ok-bg);color:var(--ok-t)}
.empty{text-align:center;color:var(--mute);padding:36px 8px}
.ref{border:1px solid var(--field);background:var(--card);color:var(--fg);border-radius:14px;padding:10px 16px;font:inherit;cursor:pointer;margin-top:16px}
.pod{display:grid;gap:10px;align-items:end;margin-top:18px}
.pc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.pc b{font-size:13.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.pc .sc{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--orange-d)}.pc small{font-size:11.5px;color:var(--mute);margin-bottom:4px}
.pc .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:start center;padding-top:8px;font-size:22px;font-weight:700;color:var(--fg)}
.pc.g1 .blk{height:104px;background:var(--gold)}.pc.g2 .blk{height:76px;background:var(--silver)}.pc.g3 .blk{height:60px;background:var(--bronze)}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.rk .n{font-weight:600;font-size:17px;color:var(--orange-d)}.rk b{font-weight:500;font-size:15px;display:block}.rk small{font-size:12px;color:var(--mute)}.rk .s{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.pb{height:6px;border-radius:6px;background:var(--track);margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--orange);border-radius:6px}
.vs{padding:12px 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);display:grid;gap:4px}
.use{border:1px solid var(--red);color:var(--red-t);background:var(--card);border-radius:10px;padding:8px 12px;font:inherit;font-weight:500;font-size:14px;cursor:pointer}
.pill{display:inline-block;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:6px;background:var(--soft);color:var(--mute);margin:6px 6px 0 0}
.grow{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.del{border:1px solid var(--field);background:var(--card);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;color:var(--red-t);cursor:pointer}
.logrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.radios button{padding:13px 6px;min-height:48px;border:1px solid var(--field);border-radius:14px;background:var(--card);font:inherit;font-weight:500;font-size:14px;cursor:pointer;color:var(--fg)}
.radios button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.sec{display:flex;align-items:center;gap:10px;margin-top:26px}
.sec b{font-size:16px;font-weight:600}.sec span{font-size:12.5px;color:var(--mute)}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.room{border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.room.hit{box-shadow:0 0 0 2px var(--amber),var(--shadow)}
.rh{padding:10px 12px}.rh b{display:block;font-size:20px;font-weight:600;line-height:1.1}.rh small{font-size:11.5px;font-weight:500}
.rn{padding:10px;display:grid;gap:8px}
.nm{background:var(--soft);border-radius:10px;padding:8px 10px;font-weight:500;font-size:13px;line-height:1.2;min-height:46px;display:flex;align-items:center}
.nm.fam{background:var(--card);border:1px dashed var(--field);color:var(--purple-d);font-weight:500}
.wheelw{position:relative;width:min(340px,100%);margin:26px auto 0}
.wheel{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 4px 18px rgba(0,0,0,.16)}.wheel.on{cursor:pointer;box-shadow:0 0 0 4px var(--amber),0 4px 18px rgba(0,0,0,.16)}

async function call(action,body){
 if(!API)throw new Error('Alamat API belum diisi di config.js');

function confetti(){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30';cv.setAttribute('aria-hidden','true');
 const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;document.body.appendChild(cv);
 const x=cv.getContext('2d');x.scale(dpr,dpr);
 const cols=['#C8102E','#f6c453','#35a99a','#4b8bd6','#7c4dc4','#ec8a3d','#d9568f','#2e9b5f'];
 const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*80,y:H*.55,vx:(Math.random()-.5)*11,vy:-(7+Math.random()*10),w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
 const t0=performance.now();
 (function f(t){const k=t-t0;x.clearRect(0,0,W,H);
  ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k/1800);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
  if(k<1800)requestAnimationFrame(f);else cv.remove()})(t0);
}

function evIcon(t){t=t.toLowerCase();
 if(/check.?in|kamar|room/.test(t))return['home','green'];
 if(/karaoke|idol|nyanyi/.test(t))return['mic','orange'];
 if(/barbe|bbq|makan|dinner|lunch|sarapan|breakfast|coffee/.test(t))return['flame','amber'];
 if(/paintball/.test(t))return['target','blue'];
 if(/game|lomba|outing/.test(t))return['trophy','orange'];
 if(/meeting|conclave|121|briefing|welcome|sharing|training/.test(t))return['users','teal'];
 return['clock','gray'];
}
function minutes(t){const m=String(t||'').match(/(\d{1,2})[.:](\d{2})/);return m?(+m[1])*60+(+m[2]):null}
function nowEvent(items){
 const n=new Date();if(n.getFullYear()!==2026||n.getMonth()!==10)return null;
 const today=items.filter(r=>{const d=String(r.day).match(/\d+/);return d&&+d[0]===n.getDate()});
 const cur=n.getHours()*60+n.getMinutes();let found=null;
 today.forEach(r=>{const m=minutes(r.time);if(m!==null&&m<=cur)found=r});
 return found;
}
function who(r){const w=String(r.who||'').toLowerCase();return w.includes('keluarga')?'K':w.includes('member')?'M':'S'}
let aud=store('pn_aud')==='K'?'K':'M';
function rRundown(v){
 if(!D.rundown.length){v.appendChild(el('div','empty','Rundown belum diisi panitia.'));return}
 const days=[];D.rundown.forEach(r=>{if(!days.includes(r.day))days.push(r.day)});
 if(!days.includes(rDay)){const n=nowEvent(D.rundown);rDay=n?n.day:days[0]}
 v.appendChild(tabsBar(days.map(d=>[d,d||'Rundown']),rDay,d=>{rDay=d;render()}));
 const split=D.rundown.some(r=>who(r)!=='S');
 if(split){const t2=tabsBar([['M','Member'],['K','Keluarga']],aud,k=>{aud=k;store('pn_aud',k);render()});t2.style.marginTop='10px';v.appendChild(t2)}
 const track=D.rundown.filter(r=>!split||who(r)==='S'||who(r)===aud);
 const now=nowEvent(track);
 const rows=track.map((r,i)=>({r,i,m:minutes(r.time)})).filter(x=>x.r.day===rDay).sort((a,b)=>(a.m===null||b.m===null)?a.i-b.i:(a.m-b.m||a.i-b.i)).map(x=>x.r);
 const t=el('div','rt');v.appendChild(t);
 const hd=el('div','rth'+(split?' sp':''));hd.appendChild(el('span','','JAM'));hd.appendChild(el('span'));if(split)hd.appendChild(el('span'));hd.appendChild(el('span','','ACARA'));t.appendChild(hd);
 const AL={M:'Member',K:'Keluarga',S:'Semua'};
 rows.forEach(r=>{
  const live=now===r,w=who(r);
  if(split){
   const row=el('div','r2'+(live?' live':''));
   row.appendChild(el('div','tt',r.time));
   const ib=el('div','ib a'+w);ib.appendChild(svg('aud'+w));row.appendChild(ib);row.appendChild(el('div','bar a'+w));
   const b=el('div');b.appendChild(el('b','',r.title));
   const sm=el('small');const txt=[r.note,r.place].filter(Boolean).join(' · ');if(txt)sm.appendChild(document.createTextNode(txt+' · '));sm.appendChild(el('span','au a'+w,AL[w]));b.appendChild(sm);row.appendChild(b);
   row.appendChild(live?el('span','livep','LIVE'):el('span'));t.appendChild(row);return;
  }
  const c=evIcon(r.title)[1],row=el('div','rtr'+(live?' live':''));
  row.appendChild(el('div','tt',r.time));row.appendChild(el('div','bar bc-'+c));
  const b=el('div');b.appendChild(el('b','',r.title));const sm=[r.note,r.place].filter(Boolean).join(' · ');if(sm)b.appendChild(el('small','',sm));row.appendChild(b);
  row.appendChild(live?el('span','livep','LIVE'):el('span'));t.appendChild(row);
 });
}

const TCOL=['teal','blue','amber','green','purple','orange','pink','indigo'];
function tTim(v){

 const list=el('div');v.appendChild(list);
 s.oninput=()=>{q=s.value;draw()};draw();
 function draw(){
  list.textContent='';const nd=q.trim().toLowerCase(),all=D.kelompok||[];
  if(!all.length){list.appendChild(el('div','empty','Data tim belum diisi panitia.'));return}
  const order=[];all.forEach(r=>{const g=r.group||'Lainnya';if(!order.includes(g))order.push(g)});
  let shown=0;
  order.forEach((g,gi)=>{
   const mem=all.filter(r=>(r.group||'Lainnya')===g);
   const rows=!nd||g.toLowerCase().includes(nd)?mem:mem.filter(r=>r.name.toLowerCase().includes(nd));
   if(!rows.length)return;shown++;
   const col=TCOL[gi%TCOL.length],note=(mem.find(r=>r.note)||{}).note;
   const w=el('section','tm');const h=el('div','tmh t-'+col);h.appendChild(el('span','cnt',mem.length+' member'));h.appendChild(el('b','',g));if(note)h.appendChild(el('small','',note));w.appendChild(h);

  });
  if(!shown)list.appendChild(el('div','empty','Tidak ada yang cocok.'));
 }
}

 box.appendChild(el('p','mute','Lobby di atas. Sayap kamar memanjang ke bawah (barat).'));

 const e=R(604,470,86,36);sv('text',{x:e.x+e.w/2,y:e.y+e.h/2-2,'text-anchor':'middle','font-size':11,'font-weight':700,fill:C('--red-t'),'letter-spacing':'.08em'},s1,'▲ ENTRANCE');
 const wa=R(690,300,10,10);sv('text',{x:W/2,y:14,'text-anchor':'middle','font-size':11,'font-weight':700,fill:C('--m-txt2'),'letter-spacing':'.08em'},s1,'▲ WISATA ALAM, GLAMPING, LUXCAMP');
 RES.forEach(([no,x,y,w,h2,def,fl])=>{const r=R(x,y,w,h2);const room=by[no];const hit=hits.has(no);
  tile(s1,no,{t:'rect',a:{x:r.x,y:r.y,width:r.w,height:r.h,rx:6},cx:r.x+r.w/2,cy:r.y+r.h/2},room,def,hit,anyHit&&!hit,tap);
  if(fl){sv('circle',{cx:r.x+r.w-7,cy:r.y+7,r:6,fill:C('--m-a'),stroke:C('--m-txt'),'stroke-width':1},s1);sv('text',{x:r.x+r.w-7,y:r.y+10.5,'text-anchor':'middle','font-size':8.5,'font-weight':700,fill:C('--fg'),'pointer-events':'none'},s1,'2')}

function rKamar(v){
 v.appendChild(tabsBar([['daftar','Daftar'],['denah','Denah']],kmSeg,k=>{kmSeg=k;render()}));
 const sw=el('div','sch'),s=el('input');s.type='search';s.placeholder='Cari nama atau nomor kamar';s.value=kq;s.setAttribute('aria-label','Cari kamar');sw.appendChild(svg('search'));sw.appendChild(s);v.appendChild(sw);
 const list=el('div');v.appendChild(list);
 if(!K){list.appendChild(el('p','mute','Memuat kamar...'));
  call('kamar').then(d=>{K=d.rooms||[];render()}).catch(e=>{list.textContent='';list.appendChild(el('div','msg err','Data kamar belum tersedia ('+errMsg(e)+'). Perbarui Apps Script ke versi terbaru.'))});return}
 let tm=null;
 s.oninput=()=>{kq=s.value;if(kmSeg==='denah'){clearTimeout(tm);tm=setTimeout(draw,250)}else draw()};draw();
 function found(nd,rooms){
  const f=rooms[0];const h=el('div','hl c-green');h.appendChild(icon('bed','green'));const b=el('div');b.appendChild(el('div','k','KAMAR DITEMUKAN'));b.appendChild(el('div','v','Kamar '+f.no));b.appendChild(el('div','s',tlabel(f.type)));h.appendChild(b);return h;
 }
 function draw(){
  list.textContent='';const nd=kq.trim().toLowerCase();
  {const occ=K.filter(r=>r.names.length||r.family),mem=K.reduce((a,r)=>a+r.names.length,0),ppl=K.reduce((a,r)=>a+r.names.length+(r.family||0),0),ty=new Set(occ.map(r=>r.type)).size,st=el('div','stats');[[mem,'Member'],[ppl,'Peserta'],[occ.length,'Kamar'],[ty,'Tipe']].forEach(([n,l])=>{const d=el('div','stat');d.appendChild(el('b','',String(n)));d.appendChild(el('span','',l));st.appendChild(d)});list.appendChild(st)}
  const rooms=K.filter(r=>!nd||(r.no+' '+r.names.join(' ')).toLowerCase().includes(nd));
  if(kmSeg==='denah'){
   if(nd&&rooms.length)list.appendChild(found(nd,rooms));
   else if(nd)list.appendChild(el('div','empty','Tidak ada yang cocok.'));
   drawDenah(list,nd);return;
  }
  if(!rooms.length){list.appendChild(el('div','empty',K.length?'Tidak ada yang cocok.':'Data kamar belum diisi.'));return}
  if(nd)list.appendChild(found(nd,rooms));
  else{const h=el('div','hl c-green');h.appendChild(icon('bed','green'));const b=el('div');b.appendChild(el('div','k','KAMAR ANDA'));b.appendChild(el('div','v','Cari nama Anda di kotak atas'));h.appendChild(b);list.appendChild(h)}
  const order=TYPES.map(t=>t[0]);
  const types=[...new Set(rooms.map(r=>r.type))].sort((a,b)=>{const x=order.indexOf(a),y=order.indexOf(b);return (x<0?99:x)-(y<0?99:y)});
  types.forEach(t=>{
   const col=tcol(t);const rs=rooms.filter(r=>r.type===t).sort((a,b)=>a.no.localeCompare(b.no,undefined,{numeric:true}));
   const sec=el('div','sec');sec.appendChild(bedIcon(col));sec.appendChild(el('b','',tlabel(t)));sec.appendChild(el('span','',rs.length+' kamar'));list.appendChild(sec);
   const g=el('div','rooms');
   rs.forEach(r=>{
    const hit=nd&&(r.no+' '+r.names.join(' ')).toLowerCase().includes(nd);
    const w=el('div','room'+(hit?' hit':''));const h=el('div','rh rm-'+col);h.appendChild(el('b','',r.no));h.appendChild(el('small','',tlabel(r.type)));w.appendChild(h);
    const n=el('div','rn');r.names.forEach(x=>n.appendChild(el('div','nm',x)));
    if(r.family)n.appendChild(el('div','nm fam','Keluarga ('+r.family+' orang)'));
    w.appendChild(n);g.appendChild(w);
   });
   list.appendChild(g);
  });
 }
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0)});
call('data').then(d=>{D=d;render()}).catch(e=>{$('#view').textContent='';const c=el('div');c.appendChild(el('div','msg err','Gagal memuat data: '+errMsg(e)));const b=el('button','go','Coba lagi');b.onclick=()=>location.reload();c.appendChild(b);$('#view').appendChild(c)});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
